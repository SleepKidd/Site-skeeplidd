<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLEEPKIDD STUDIO | Премиальная веб-разработка</title>
    
    <!-- Премиальные шрифты -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #020204;
            --accent-amber: #ffaa00;
            --accent-rgb: 255, 170, 0;
            --text-white: #ffffff;
            --text-darker: #555562;
            --glass-core: rgba(6, 6, 10, 0.75);
            --border-glow: rgba(255, 170, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            font-family: 'Inter', sans-serif;
            color: var(--text-white);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Холст для спецэффекта частиц */
        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* Неоновые аномалии на заднем плане */
        .plasma-glow {
            position: fixed;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(255, 170, 0, 0.07) 0%, transparent 70%);
            top: -20%;
            left: -10%;
            z-index: -2;
            filter: blur(120px);
            pointer-events: none;
            animation: driftOne 25s ease-in-out infinite alternate;
        }

        .plasma-glow-2 {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 85, 0, 0.05) 0%, transparent 70%);
            bottom: -10%;
            right: -10%;
            z-index: -2;
            filter: blur(100px);
            pointer-events: none;
            animation: driftTwo 20s ease-in-out infinite alternate;
        }

        @keyframes driftOne {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 80px) scale(1.2); }
        }
        @keyframes driftTwo {
            0% { transform: translate(0, 0) scale(1.1); }
            100% { transform: translate(-80px, -60px) scale(0.9); }
        }

        .container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 70px 24px;
            position: relative;
        }

        /* Заголовок студии */
        .main-header {
            text-align: center;
            margin-bottom: 70px;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.4rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 20px rgba(var(--accent-rgb), 0.3), 0 0 40px rgba(var(--accent-rgb), 0.1);
            animation: TitleGlowPulse 3s infinite ease-in-out alternate;
        }

        @keyframes TitleGlowPulse {
            0% { text-shadow: 0 0 15px rgba(var(--accent-rgb), 0.2); }
            100% { text-shadow: 0 0 35px rgba(var(--accent-rgb), 0.6), 0 0 60px rgba(var(--accent-rgb), 0.2); }
        }

        .subtitle-block {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .random-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-darker);
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(10px);
            animation: techFadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .text-line-1 { animation-delay: 0.2s; }
        .text-line-2 { animation-delay: 0.4s; }
        .text-line-3 { animation-delay: 0.6s; }

        @keyframes techFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>
    <div class="plasma-glow"></div>
    <div class="plasma-glow-2"></div>

    <main class="container">
        <header class="main-header">
            <h1 class="main-title">SLEEPKIDD STUDIO</h1>
            <div class="subtitle-block">
                <p class="random-text text-line-1">// разработка премиальных сайтов и веб-сервисов</p>
                <p class="random-text text-line-2">// индивидуальный код • адаптивный 3D дизайн</p>
                <p class="random-text text-line-3">// создание цифровых решений для ваших задач</p>
            </div>
        </header>
